# Contributor workspace: one lockfile and one environment for the plugin and the development tools.
# Nothing here ships; the installable plugin is plugins/jobkit (its own pyproject.toml is what users get).
[project]
name = "jobkit-dev"
version = "0"
description = "Contributor environment for jobkit (not published, not installed by the plugin)"
requires-python = ">=3.14"
dependencies = ["jobkit"]

[dependency-groups]
dev = [
    "pylint>=3.2",
    "pyright>=1.1.414",
    "ruff>=0.6",
]

[tool.uv]
# Keep equal to plugins/jobkit/pyproject.toml (the installers read that one); a test checks it.
required-version = ">=0.13.7"

[tool.uv.sources]
jobkit = { workspace = true }

[tool.uv.workspace]
members = ["plugins/jobkit"]
