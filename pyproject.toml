[project]
name = "jobkit"
version = "0.1.0"
description = "Local resume data, matching and interview-prep tools for a job search"
requires-python = ">=3.14"
dependencies = [
    "pypdf>=6.0",
]

[dependency-groups]
dev = [
    "pylint>=3.2",
    "pyright>=1.1.414",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[project.scripts]
jobkit = "jobkit.admin:main"
profile = "jobkit.user.profile:main"
process-resumes = "jobkit.resumes.process_resumes:main"
query-resume = "jobkit.resumes.query_resume:main"
build-resume = "jobkit.resumes.build_resume:main"
arch = "jobkit.interview.arch:main"
lead = "jobkit.interview.lead:main"
prep = "jobkit.interview.prep:main"
sessions = "jobkit.interview.sessions:main"
readiness = "jobkit.interview.readiness:main"

[tool.uv.build-backend]
module-name = "jobkit"

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["src/jobkit"]
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportUnusedCoroutine = "error"
reportUnnecessaryTypeIgnoreComment = "warning"
