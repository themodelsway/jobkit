target-version = "py314"
src = ["src", "tests"]

[lint]
preview = true
explicit-preview-rules = true
# Errors, pyflakes, pyupgrade, bugbear. E402 is off for tests that import after setup.
select = ["E4", "E7", "E9", "F", "UP", "B", "PLW1514"]   # PLW1514: every text file names its encoding
ignore = ["E402"]
